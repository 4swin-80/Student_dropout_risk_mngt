<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register - Student Risk Management</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <h3 class="fw-bold">
                            Create Account
                        </h3>

                        <p class="text-muted">
                            Student Dropout Risk Management System
                        </p>

                    </div>


                    <!-- Messages -->

                    {% if messages %}

                        {% for message in messages %}

                            <div
                                class="alert alert-danger alert-dismissible fade show"
                                role="alert"
                            >

                                {{ message }}

                                <button
                                    type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert"
                                ></button>

                            </div>

                        {% endfor %}

                    {% endif %}


                    <!-- Registration Form -->

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Username -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter email"
                            >

                        </div>


                        <!-- Role -->

                        <div class="mb-3">

                            <label
                                for="role"
                                class="form-label"
                            >
                                Register As
                            </label>

                            <select
                                class="form-select"
                                id="role"
                                name="role"
                                required
                            >

                                <option value="" selected disabled>
                                    Select your role
                                </option>

                                <option value="TEACHER">
                                    Teacher
                                </option>

                                <option value="MENTOR">
                                    Mentor
                                </option>

                            </select>

                            <div class="form-text">
                                Administrator accounts are created by the system administrator.
                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label
                                for="confirm_password"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required
                            >

                        </div>


                        <!-- Register -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Register
                            </button>

                        </div>

                    </form>


                    <!-- Login -->

                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Already have an account?
                        </span>

                        <a
                            href="{% url 'login' %}"
                            class="text-decoration-none"
                        >
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
